server:
  port: 8106
spring:
  application:
    name: live-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          review-service:
            connect-timeout: 800
            read-timeout: 1200
          user-service:
            connect-timeout: 800
            read-timeout: 1200
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/kumao_music?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kumao123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
kumao:
  moderation:
    mute-minutes: ${MODERATION_MUTE_MINUTES:60}
    reject-risk-score: ${MODERATION_REJECT_RISK:35}
  srs:
    # SRS 推流服务地址
    rtmp-host: ${SRS_RTMP_HOST:127.0.0.1}
    rtmp-port: ${SRS_RTMP_PORT:1935}
    # 户外直播推流主机名（手机需要访问的局域网/公网地址）；留空则自动取本机局域网 IP
    push-host: ${SRS_PUSH_HOST:}
    http-port: ${SRS_HTTP_PORT:8088}
    # 推流鉴权密钥
    push-key: ${SRS_PUSH_KEY:kumao-srs-push-key}
    # 对外播放域名（HLS 播放地址）
    play-host: ${SRS_PLAY_HOST:http://127.0.0.1:8088}
    # SRS HTTP API，用于轮询活跃流并经 WebSocket 推送开播/断流状态
    api-url: ${SRS_API_URL:http://127.0.0.1:1985}
    status-interval-ms: ${SRS_STATUS_INTERVAL_MS:3000}
  danmaku:
    # 敏感词（逗号分隔，演示用）
    sensitive-words: 广告,加微信,加QQ,私聊,赌博,色情,诈骗,代购,刷礼物
  mq:
    danmaku-queue: kumao.live.danmaku
    danmaku-exchange: kumao.live.exchange
    danmaku-routing-key: live.danmaku
management:
  endpoints:
    web:
      exposure:
        include: health,info
