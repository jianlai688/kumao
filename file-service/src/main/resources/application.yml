server:
  port: 8105
  tomcat:
    max-http-form-post-size: 500MB
spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/kumao_music?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
kumao:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    # 对外访问地址（浏览器/APP 使用）；留空则返回 /static/{bucket}/... 走网关代理
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:kumao}
  upload:
    image-ext: jpg,jpeg,png,gif,webp,bmp
    audio-ext: mp3,wav,flac,m4a,aac
    video-ext: mp4,flv,mov,mkv,m3u8,ts
    lyric-ext: lrc,txt
    image-max-size: 10485760
    audio-max-size: 104857600
    video-max-size: 524288000
    lyric-max-size: 1048576
management:
  endpoints:
    web:
      exposure:
        include: health,info
