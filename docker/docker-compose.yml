version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: kumao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kumao123456
      MYSQL_DATABASE: kumao_music
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - kumao-mysql:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pkumao123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kumao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kumao-redis:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: kumao-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - kumao-nacos:/home/nacos/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: kumao-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    # 本地已有镜像；如需官方镜像可改为 minio/minio:RELEASE.2024-06-13T22-53-53Z
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: kumao-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kumao-minio:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: kumao-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - kumao-es:/usr/share/elasticsearch/data

  sentinel:
    image: bladex/sentinel-dashboard:1.8.7
    container_name: kumao-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"

  srs:
    image: ossrs/srs:5
    container_name: kumao-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8088:8080"
      - "1985:1985"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - kumao-srs:/usr/local/srs/objs/nginx/html

volumes:
  kumao-mysql:
  kumao-redis:
  kumao-nacos:
  kumao-minio:
  kumao-es:
  kumao-srs:
