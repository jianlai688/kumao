# SRS 5.x 配置：RTMP 推流 + HLS 拉流 + 录制回放
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;
    play {
        gop_cache       on;
        queue_length    10;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }
    dvr {
        enabled         on;
        dvr_plan        session;
        dvr_path        ./objs/nginx/html/replay/[app]/[stream].[timestamp].mp4;
        dvr_wait_keyframe on;
    }
    http_hooks {
        enabled         on;
        # 推流鉴权：交给 live-service 校验 token（可选启用）
        # on_publish    http://host.docker.internal:8106/live/rooms/push-auth;
        # 推流开始/结束状态由 live-service 轮询 SRS API 后经 WebSocket 下发
        # （Docker 网络下 HTTP 回调不一定能访问宿主机，轮询更稳定）
        on_dvr          http://host.docker.internal:8106/live/rooms/dvr-callback;
        on_hls          http://host.docker.internal:8106/live/rooms/hls-callback;
    }
}
