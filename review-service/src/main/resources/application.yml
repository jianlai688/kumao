server:
  port: ${REVIEW_SERVICE_PORT:8111}

spring:
  application:
    name: review-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/kumao_music?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kumao123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

kumao:
  jwt:
    secret: ${JWT_SECRET:kumao-music-platform-jwt-secret-key-2026-please-change}
    expire-seconds: 604800
  ai:
    # 模型 API Key 落库加密口令，生产环境必须通过环境变量覆盖
    config-secret: ${AI_CONFIG_SECRET:kumao-ai-config-dev-secret-change-me}
    # 审核模型的环境变量兜底；管理员在「模型配置」中启用后会优先使用数据库配置
    deepseek:
      # 默认关闭外部模型，未配置时自动走可解释本地规则
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:20}
      max-retries: ${DEEPSEEK_MAX_RETRIES:2}
      temperature: ${DEEPSEEK_TEMPERATURE:0.1}
    auto-review:
      # AI 自动审核：定时拉取待审内容，PASS 且低风险的内容自动处理
      enabled: ${AI_AUTO_REVIEW_ENABLED:true}
      interval-ms: ${AI_AUTO_REVIEW_INTERVAL_MS:60000}
      gateway-url: ${KUMAO_GATEWAY_URL:http://127.0.0.1:8080}
      page-size: ${AI_AUTO_REVIEW_PAGE_SIZE:30}
      pass-risk-threshold: ${AI_AUTO_REVIEW_PASS_RISK:35}
      max-items-per-run: ${AI_AUTO_REVIEW_MAX_ITEMS:60}
      auto-approve-categories: ${AI_AUTO_REVIEW_CATEGORIES:ANCHOR_APPLY,MUSICIAN,ADVERTISER,AD_MATERIAL,AD_PLAN,SONG,MV,COMMENT,DANMAKU,SINGER}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  level:
    com.kumao: info
