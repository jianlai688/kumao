plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kumao.music'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kumao.music'
        minSdk 23
        targetSdk 34
        versionCode 152
        versionName '1.5.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}














