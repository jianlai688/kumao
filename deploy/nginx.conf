# ============================================================
#  Kumao Music Platform - public gateway (Windows nginx)
#  Public entry: https://<cpolar-domain> -> cpolar tunnel -> nginx :80
#
#  Routing:
#    /            -> built SPA (kumao-web/dist, Hash router, no rewrite needed)
#    /api/        -> kumao-gateway :8080  (gateway does StripPrefix itself,
#                    so proxy_pass MUST NOT carry a URI part)
#    /static/     -> kumao-gateway :8080  (file-service media relay)
#    /ws/         -> kumao-gateway :8080  (WebSocket: live danmaku / musician)
#    /hls/        -> SRS :8088            (/hls/live/x.m3u8 -> /live/x.m3u8)
#
#  NOTE: nginx does not inherit server-level proxy_set_header into a location
#  that declares any proxy_set_header of its own -> headers are repeated in
#  every location below.
# ============================================================

worker_processes  1;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # file-service: spring.servlet.multipart.max-request-size = 520MB
    client_max_body_size 520m;
    client_body_timeout  300s;

    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/javascript application/xml
                      image/svg+xml application/wasm;
    gzip_vary         on;

    upstream km_gateway {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream km_srs {
        server 127.0.0.1:8088;
    }

    server {
        listen       80;
        server_name  _;

        root   D:/kumao/kumao-web/dist;
        index  index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # ---------- backend API ----------
        # Buffering off so SSE / AI review and long polls stream immediately.
        location /api/ {
            proxy_pass http://km_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ---------- uploaded media (MinIO behind file-service) ----------
        location /static/ {
            proxy_pass http://km_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 300s;
            proxy_buffering    on;
            proxy_max_temp_file_size 0;
        }

        # ---------- WebSocket ----------
        location /ws/ {
            proxy_pass http://km_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- HLS live streams (SRS) ----------
        location /hls/ {
            proxy_pass http://km_srs/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering    off;
            proxy_read_timeout 300s;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin * always;
        }

        # ---------- Android 安装包下载 ----------
        # 明确 MIME + 附件下载，避免安卓浏览器把 .apk 存成 .apk.1 / 未知文件
        location ~* ^/downloads/.+\.apk$ {
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="KuMao-Android-v1.5.2.apk"';
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # ---------- static SPA ----------
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
