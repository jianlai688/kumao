<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#050506"/>
  <title>酷猫音乐 · 听见好声音</title>
  <style>
    html, body { margin: 0; background: #050506; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; background: #050506; color: #d8ff3e; z-index: 9999;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; letter-spacing: 2px;
    }
    #boot .ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(216, 255, 62, .18); border-top-color: #d8ff3e;
      animation: spin .9s linear infinite;
    }
    #boot .txt { font-size: 13px; color: rgba(243, 244, 246, .5); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app"></div>
<div id="boot"><div class="ring"></div><div class="txt">KUMAO MUSIC</div></div>
<script type="module" src="/src/main.js"></script>
<script>
  window.addEventListener('load', function () {
    var boot = document.getElementById('boot')
    if (boot) { boot.style.transition = 'opacity .4s'; boot.style.opacity = '0'; setTimeout(function () { boot.remove() }, 420) }
  })
</script>
</body>
</html>
