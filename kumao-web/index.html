<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f7f5fb"/>
  <title>酷猫音乐 · 听见好声音</title>
  <style>
    html, body { margin: 0; background: #f7f5fb; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; background: #f7f5fb; color: #8b3fce; z-index: 9999;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; letter-spacing: 2px;
    }
    #boot .ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(139, 63, 206, .14); border-top-color: #8b3fce;
      animation: spin .9s linear infinite;
    }
    #boot .txt { font-size: 13px; color: #786f85; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app"></div>
<div id="boot"><div class="ring"></div><div class="txt">KUMAO MUSIC</div></div>
<script type="module" src="/src/main.js"></script>
<script>
  // 启动遮罩只等服务端/首屏 JS 就绪，不跟着 window.load 一起等图片、音频这些慢资源。
  window.__kmHideBoot = function () {
    var boot = document.getElementById('boot')
    if (!boot || boot.dataset.hidden) return
    boot.dataset.hidden = '1'
    boot.style.transition = 'opacity .35s'
    boot.style.opacity = '0'
    setTimeout(function () { boot.remove() }, 380)
  }
  // 兜底：极端情况下最多挡 6 秒
  setTimeout(function () { window.__kmHideBoot && window.__kmHideBoot() }, 6000)
</script>
</body>
</html>
